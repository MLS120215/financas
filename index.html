<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="description" content="Renda, gastos, metas e patrimônio, mês a mês">
<meta name="theme-color" content="#1f5c46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: cabeçalho com anos, barra de meses, abas; cada aba é um painel com resumo antes do detalhe */
  --bg:#f4f6f4; --surface:#ffffff; --ink:#17231e; --muted:#5f6d66; --line:#dde3df;
  --accent:#1f5c46; --accent-soft:#e3efe9;
  --good:#2e7d4f; --bad:#b3261e; --warn:#a86a00; --bad-soft:#fbe9e7; --warn-soft:#fdf1dc;
  --c1:#1f5c46; --c2:#d08a2b; --c3:#5b7fb8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211d; --ink:#e6ece8; --muted:#97a59d; --line:#2b3530;
    --accent:#6cc39b; --accent-soft:#1f3229;
    --good:#6cc39b; --bad:#f08a80; --warn:#e5b25a; --bad-soft:#3a201e; --warn-soft:#382c16;
    --c1:#6cc39b; --c2:#e5a24c; --c3:#8fb0e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --ink:#e6ece8; --muted:#97a59d; --line:#2b3530;
  --accent:#6cc39b; --accent-soft:#1f3229;
  --good:#6cc39b; --bad:#f08a80; --warn:#e5b25a; --bad-soft:#3a201e; --warn-soft:#382c16;
  --c1:#6cc39b; --c2:#e5a24c; --c3:#8fb0e6;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:11px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.1}
h2{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.years{display:flex;gap:4px;flex-wrap:wrap}
.years button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:6px 12px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.years button.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.years button.novo{border-style:dashed;color:var(--accent);background:none}
.months{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.months button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.months button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.months button.neg::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--muted);font:500 12px var(--body);padding:4px 10px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 13px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.sec td{background:var(--accent-soft);font-weight:600;color:var(--accent);font-size:12px;padding:6px}
tr.tot td{font-weight:600;background:color-mix(in srgb,var(--line) 35%,transparent)}
input.cell,select.cell{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:5px 6px;border-radius:6px}
input.cell:hover,select.cell:hover{border-color:var(--line)}
input.cell:focus,select.cell:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.cell.num{text-align:right}
.paid{border:1px solid var(--line);background:none;font:600 11px var(--body);padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.paid.yes{background:var(--accent-soft);color:var(--good);border-color:transparent}
.paid.no{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--bad);background:var(--bad-soft)}
.add{display:grid;grid-template-columns:2fr 1.2fr 1.3fr 1fr auto auto;gap:6px;align-items:center}
.field,.add input,.add select{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:8px;border-radius:8px;min-width:0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar .t span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.note{font-size:12px;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:13px}
.banner.err{border-color:var(--bad);background:var(--bad-soft)}
.prog{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--accent-soft);color:var(--good)}.pill.part{background:var(--warn-soft);color:var(--warn)}.pill.no{background:var(--bad-soft);color:var(--bad)}
.chart{position:relative;height:280px}
.metaIn{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.metaIn input{width:140px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:6px 8px;border-radius:8px;text-align:right}
td.mo{white-space:nowrap;font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form label{min-width:0}
.form .field{width:100%}
td.num{white-space:nowrap}
.grid2>*{min-width:0}
.lim{display:flex;flex-direction:column;gap:6px}
.limtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.limbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.limbar .fill{height:100%;border-radius:5px}
.limbar .fill.ok{background:var(--good)}.limbar .fill.warn{background:var(--warn)}.limbar .fill.crit{background:var(--bad)}
.cardbox{display:flex;flex-direction:column;gap:6px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.kpis.k3{grid-template-columns:1fr 1fr}[id^="lanc-cc"] thead{display:none}[id^="lanc-cc"] table,[id^="lanc-cc"] tbody{display:block}
  [id^="lanc-cc"] tr[data-cc]{display:grid;grid-template-columns:minmax(0,1fr) 96px 30px;gap:2px 4px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
  [id^="lanc-cc"] tr[data-cc] td{border:0;padding:0;min-width:0 !important}
  [id^="lanc-cc"] tr[data-cc] td:nth-child(1){grid-column:1/2;grid-row:1}
  [id^="lanc-cc"] tr[data-cc] td:nth-child(3){grid-column:2/4;grid-row:1}
  [id^="lanc-cc"] tr[data-cc] td:nth-child(2){grid-column:1/3;grid-row:2}
  [id^="lanc-cc"] tr[data-cc] td:nth-child(4){grid-column:3;grid-row:2;justify-self:end}
  [id^="lanc-cc"] input.cell[data-ccf="desc"],[id^="lanc-cc"] input.cell[data-ccf="valor"]{font-weight:600}
  [id^="lanc-cc"] select.cell{font-size:12px;color:var(--muted);width:auto;max-width:100%}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative}
.sw.on{border-color:var(--ink)}
.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.ccbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ccrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ccrow:last-child{border-bottom:0}
.ccv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.metaIn label{color:var(--muted)}
@media (max-width:640px){.ccrow{grid-template-columns:minmax(0,1fr) auto;}.ccrow .chip{grid-column:2}}
.welcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.hidden{display:none !important}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .wrap{gap:12px}
  h1{font-size:22px}
  .brand img{width:38px;height:38px}
  .kpi .v{font-size:18px}
  .tabs button{padding:10px;font-size:13px}
  #lanc thead{display:none}
  #lanc table,#lanc tbody{display:block}
  #lanc tr[data-i]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 92px 30px;gap:2px 4px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
  #lanc tr[data-i] td{border:0;padding:0;min-width:0 !important;width:auto}
  #lanc tr[data-i] td:nth-child(1){grid-column:1/3;grid-row:1}
  #lanc tr[data-i] td:nth-child(4){grid-column:3/5;grid-row:1}
  #lanc tr[data-i] td:nth-child(2){grid-column:1;grid-row:2}
  #lanc tr[data-i] td:nth-child(3){grid-column:2;grid-row:2}
  #lanc tr[data-i] td:nth-child(5){grid-column:3;grid-row:2;justify-self:end}
  #lanc tr[data-i] td:nth-child(6){grid-column:4;grid-row:2;justify-self:end}
  #lanc tr[data-i] input.cell,#lanc tr[data-i] select.cell{min-width:0;width:100%}
  #lanc tr[data-i] input.cell[data-f="valor"]{font-weight:600}
  #lanc tr[data-i] select.cell{font-size:12px;color:var(--muted)}
  #lanc tr[data-i] input.cell[data-f="desc"]{font-weight:600}
  .add #aDesc{grid-column:1/3}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div>
        <h1 id="h1">Finanças</h1>
        <div class="note" id="hello">Renda, gastos, metas e patrimônio, mês a mês</div>
      </div>
    </div>
    <div class="hright">
      <nav class="years" id="years" aria-label="Ano"></nav>
      <button class="iconbtn" id="eye" title="Esconder valores" aria-label="Esconder valores"></button>
      <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusTxt">Neste aparelho</span></div>
    </div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <nav class="months" id="months" aria-label="Mês"></nav>
  <nav class="tabs" id="tabs">
    <button data-tab="mes" class="on">Mês</button>
    <button data-tab="cartoes">Cartões</button>
    <button data-tab="ano">Ano</button>
    <button data-tab="metas">Metas</button>
    <button data-tab="pat">Patrimônio</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
  <main id="view"></main>
</div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
